# TokenMiner nginx
#
# Front door for stratum traffic. The proxy speaks plain TCP, so nginx either terminates TLS
# here or passes the connection through untouched.

worker_processes auto;

events {
    worker_connections 4096;
}

stream {
    upstream stratum_proxy {
        # The compose service name; replace with 127.0.0.1:3333 when running the proxy natively.
        server stratum_proxy:3333;
    }

    # Plain stratum. Works out of the box: `--stratum <host>:3333`.
    server {
        listen 3333;
        proxy_pass stratum_proxy;

        proxy_connect_timeout 5s;
        # Mining sessions are long-lived and mostly idle; do not cut them short.
        proxy_timeout 1h;
    }

    # TLS-terminating variant. Uncomment and provide a certificate to serve `stratum+ssl://`.
    #
    # server {
    #     listen 3334 ssl;
    #     proxy_pass stratum_proxy;
    #
    #     ssl_certificate     /etc/nginx/certs/stratum.crt;
    #     ssl_certificate_key /etc/nginx/certs/stratum.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #
    #     proxy_connect_timeout 5s;
    #     proxy_timeout 1h;
    # }
}
